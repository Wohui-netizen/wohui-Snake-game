<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贪吃蛇 · Snake</title>
<style>
  :root {
    --page-bg: #f7f8fa;
    --text: #1f2933;
    --score: #a33b3b;
    --muted: #5b6472;
    --board-bg: #85e8d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--page-bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "Yu Gothic UI", "Meiryo", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .game { width: min(480px, 92vw); padding: 14px 0 20px; }
  .scoreboard {
    margin: 0 0 10px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--score);
    letter-spacing: 0.5px;
  }
  .board-wrap { position: relative; }
  #board {
    display: block;
    width: 100%;
    height: auto;
    background: var(--board-bg);
    border-radius: 4px;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 18px;
    border-radius: 4px;
    background: rgba(8, 38, 34, 0.55);
    color: #fff;
    text-align: center;
    pointer-events: none;   /* the board underneath must stay touchable */
  }
  .overlay[hidden] { display: none; }
  .overlay strong { font-size: 20px; }
  .overlay span { font-size: 14px; opacity: 0.92; line-height: 1.5; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 14px;
  }
  button {
    min-width: 138px;
    padding: 9px 18px;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: #fff;
    border: 1px solid #c8ccd4;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { background: #f1f3f7; border-color: #8f97a5; }
  button:active { background: #e7eaf0; }
  button:focus-visible { outline: 2px solid #4f7df3; outline-offset: 2px; }
  .hint {
    margin: 12px 0 0;
    min-height: 20px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .languages {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 2px 4px;
    margin: 10px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  .languages button {
    min-width: 0;
    padding: 2px 5px;
    font: inherit;
    font-size: 13px;
    color: #2f5fd0;
    background: none;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
  }
  .languages button:hover { background: #eaeefb; text-decoration: underline; }
  .languages button[aria-current="true"] {
    color: var(--text);
    font-weight: 700;
    cursor: default;
  }
  .languages button[aria-current="true"]:hover { background: none; text-decoration: none; }
  .languages span { color: #aab2bd; }
  /* On-screen direction pad: the reliable fallback next to swiping. */
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(2, 46px);
    gap: 8px;
    justify-content: center;
    margin: 12px auto 0;
    width: max-content;
  }
  .dpad button {
    min-width: 0;
    width: 100%;
    height: 100%;
    padding: 0;
    font-size: 17px;
    line-height: 1;
    color: var(--text);
    background: #fff;
    border: 1px solid #c8ccd4;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .dpad button:hover { background: #f1f3f7; }
  .dpad button:active { background: #e7eaf0; }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  /* Hide the pad only on devices that have no touch screen at all. */
  @media (hover: hover) and (pointer: fine) and (any-pointer: fine) and (not (any-pointer: coarse)) {
    .dpad { display: none; }
  }
</style>

  var KEY_DIRECTIONS = {
    arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'

  function toDirection(value) {
    if (typeof value === 'string') return DIRECTIONS[value] || null;
    if (value && typeof value.x === 'number' && typeof value.y === 'number') {
      if (Math.abs(value.x) + Math.abs(value.y) !== 1) return null;
      return { x: value.x, y: value.y };
    }
    return null;

  /* Accepts 'en', 'EN', 'zh-cn', ... and returns the canonical code, or null. */

    if (typeof code !== 'string') return null;
    var wanted = code.trim().toLowerCase();
    for (var i = 0; i < LANGUAGES.length; i++) {
      if (LANGUAGES[i].code.toLowerCase() === wanted) return LANGUAGES[i].code;
    }
    return null;
  }

  function SnakeGame(canvas, options) {
    var config = options || {};
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.cols = config.cols || 20;
    this.rows = config.rows || 20;
    this.cell = config.cell || 24;
    this.difficulties = config.difficulties || DIFFICULTIES;
    this.difficultyIndex = typeof config.difficultyIndex === 'number' ? config.difficultyIndex : 1;

    this.languageKey = config.languageStorageKey || 'snake-game:language';

    this.best = this.readBest();

    if (config.autoLoop !== false && typeof window.requestAnimationFrame === 'function') {

    }

  SnakeGame.prototype.difficulty = function () {
    return this.difficulties[this.difficultyIndex];
  };

  SnakeGame.prototype.stepMs = function () {
    return this.difficulty().stepMs;
  };

  SnakeGame.prototype.readBest = function () {
    try {
      var raw = window.localStorage.getItem(this.storageKey);
      var value = parseInt(raw, 10);
      return value > 0 ? value : 0;
    } catch (error) {
      return 0;
    }
  };

  SnakeGame.prototype.saveBest = function (value) {
    try {
      window.localStorage.setItem(this.storageKey, String(value));
    } catch (error) {
      /* Private mode or file:// limits: skip persistence rather than fail. */
    }
  };

  SnakeGame.prototype.readLanguage = function () {
    try {
      return normalizeLanguage(window.localStorage.getItem(this.languageKey));
    } catch (error) {
      return null;
    }
  };

  SnakeGame.prototype.saveLanguage = function (code) {
    try {
      window.localStorage.setItem(this.languageKey, code);
    } catch (error) {
      /* Keep the choice for this session only when storage is unavailable. */
    }
  };

    if (!next || next === this.language) return;
    this.language = next;
    this.saveLanguage(next);
    this.emit();
  };

    return MESSAGES[this.language] || MESSAGES[DEFAULT_LANGUAGE];
  };

     back to English (then to the raw key) so a partial translation still runs. */
  SnakeGame.prototype.text = function (key, values) {
    var template = this.messages()[key];
    if (typeof template !== 'string') template = MESSAGES[DEFAULT_LANGUAGE][key];
    if (typeof template !== 'string') return key;
    if (!values) return template;
    return template.replace(/\{(\w+)\}/g, function (match, name) {
      return values[name] === undefined ? match : values[name];

    var height = this.rows * this.cell;
    this.canvas.width = Math.round(width * ratio);
    this.canvas.height = Math.round(height * ratio);
    if (this.ctx.setTransform) this.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    this.height = height;
  };

  SnakeGame.prototype.reset = function () {
    var centerX = Math.floor(this.cols / 2);
    var centerY = Math.floor(this.rows / 2);
    this.snake = [
      { x: centerX, y: centerY },
      { x: centerX - 1, y: centerY },
      { x: centerX - 2, y: centerY }
    ];
    this.direction = { x: 1, y: 0 };
    this.queued = [];
    this.score = 0;
    this.state = 'idle';
    this.endReason = null;
    this.food = this.spawnFood();
    this.accumulator = 0;
    this.lastTimestamp = null;

    this.reset();

    this.lastTimestamp = null;
    this.accumulator = 0;

    if (this.state !== 'running') return;
    this.state = 'paused';
    this.emit();
  };

  SnakeGame.prototype.resume = function () {
    if (this.state !== 'paused') return;
    this.state = 'running';
    this.lastTimestamp = null;
    this.accumulator = 0;
    this.emit();
  };

  SnakeGame.prototype.toggleStart = function () {
    if (this.state === 'running') this.pause();
    else if (this.state === 'paused') this.resume();

    if (next.x === reference.x && next.y === reference.y) return;
    if (this.queued.length >= 2) return;
    this.queued.push(next);
  };

    if (typeof value === 'number') {
      index = Math.max(0, Math.min(this.difficulties.length - 1, value));
    } else {
      for (var i = 0; i < this.difficulties.length; i++) {
        if (this.difficulties[i].id === value) index = i;
      }

    if (index === this.difficultyIndex) return;
    this.difficultyIndex = index;
    this.accumulator = 0;
    this.emit();
  };

  SnakeGame.prototype.nextDifficulty = function () {
    this.setDifficulty((this.difficultyIndex + 1) % this.difficulties.length);
  };

  SnakeGame.prototype.spawnFood = function () {
    var taken = {};
    for (var i = 0; i < this.snake.length; i++) {
      taken[this.snake[i].x + ',' + this.snake[i].y] = true;
    }
    var free = [];
    for (var y = 0; y < this.rows; y++) {
      for (var x = 0; x < this.cols; x++) {
        if (!taken[x + ',' + y]) free.push({ x: x, y: y });
      }

    if (!free.length) return null;
    return free[Math.floor(Math.random() * free.length)];
  };

  SnakeGame.prototype.end = function (reason) {

    this.endReason = reason;
    if (this.score > this.best) {
      this.best = this.score;
      this.saveBest(this.best);

    this.emit();
  };

  SnakeGame.prototype.tick = function () {

    var nextX = head.x + this.direction.x;
    var nextY = head.y + this.direction.y;

    if (nextX < 0 || nextY < 0 || nextX >= this.cols || nextY >= this.rows) {
      this.end('wall');
      return;
    }

    var eating = !!this.food && nextX === this.food.x && nextY === this.food.y;
    var body = eating ? this.snake : this.snake.slice(0, -1);

      if (body[i].x === nextX && body[i].y === nextY) {
        this.end('self');
        return;
      }
    }

    this.snake.unshift({ x: nextX, y: nextY });
    if (eating) {
      this.score += 1;
      this.food = this.spawnFood();
      if (!this.food) {
        this.end('win');
        return;
      }
    } else {
      this.snake.pop();
    }
    this.emit();
  };

  SnakeGame.prototype.frame = function (timestamp) {
    if (this.state === 'running') {
      if (this.lastTimestamp === null) this.lastTimestamp = timestamp;
      var delta = Math.min(timestamp - this.lastTimestamp, this.stepMs() * 4);
      this.lastTimestamp = timestamp;
      this.accumulator += Math.max(0, delta);
      while (this.state === 'running' && this.accumulator >= this.stepMs()) {
        this.accumulator -= this.stepMs();
        this.tick();
      }
    } else {
      this.lastTimestamp = null;
      this.accumulator = 0;
    }
    this.render();
    if (typeof window.requestAnimationFrame === 'function') {
      window.requestAnimationFrame(this.frame);
    }
  };

      difficultyLabel: this.difficultyLabel(),

  SnakeGame.prototype.roundRect = function (x, y, width, height, radius) {
    var ctx = this.ctx;
    var r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + width - r, y);
    ctx.arcTo(x + width, y, x + width, y + r, r);
    ctx.lineTo(x + width, y + height - r);
    ctx.arcTo(x + width, y + height, x + width - r, y + height, r);
    ctx.lineTo(x + r, y + height);
    ctx.arcTo(x, y + height, x, y + height - r, r);
    ctx.lineTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.closePath();

  SnakeGame.prototype.arrowDirection = function (index) {
    if (index === 0) return this.direction;
    var ahead = this.snake[index - 1];
    var here = this.snake[index];
    return { x: Math.sign(ahead.x - here.x), y: Math.sign(ahead.y - here.y) };
  };

  SnakeGame.prototype.render = function () {
    var ctx = this.ctx;
    var cell = this.cell;
    var width = this.cols * cell;
    var height = this.rows * cell;
    var i;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = COLORS.board;
    ctx.fillRect(0, 0, width, height);

    ctx.lineWidth = 1;
    ctx.strokeStyle = COLORS.grid;
    ctx.beginPath();
    for (i = 0; i <= this.cols; i++) {
      var px = Math.round(i * cell) + 0.5;
      ctx.moveTo(px, 0);
      ctx.lineTo(px, height);
    }
    for (i = 0; i <= this.rows; i++) {
      var py = Math.round(i * cell) + 0.5;
      ctx.moveTo(0, py);
      ctx.lineTo(width, py);
    }
    ctx.stroke();

    if (this.food) {
      this.roundRect(this.food.x * cell + 3, this.food.y * cell + 3, cell - 6, cell - 6, 4);
      ctx.fillStyle = COLORS.food;
      ctx.fill();
    }

    for (i = this.snake.length - 1; i >= 0; i--) {
      var segment = this.snake[i];
      var left = segment.x * cell + 1.5;
      var top = segment.y * cell + 1.5;
      this.roundRect(left, top, cell - 3, cell - 3, 3);
      ctx.fillStyle = i === 0 ? COLORS.head : COLORS.body;
      ctx.fill();
      if (i > 0) this.drawArrow(segment, this.arrowDirection(i));
    }

    if (this.snake.length) this.drawEyes(this.snake[0]);

    ctx.lineWidth = 2;
    ctx.strokeStyle = COLORS.border;
    ctx.strokeRect(1, 1, width - 2, height - 2);
  };

  SnakeGame.prototype.drawArrow = function (segment, direction) {
    var ctx = this.ctx;
    var cell = this.cell;
    var centerX = segment.x * cell + cell / 2;
    var centerY = segment.y * cell + cell / 2;
    var size = cell * 0.22;
    var perpendicularX = -direction.y;
    var perpendicularY = direction.x;

    ctx.beginPath();
    ctx.moveTo(centerX + direction.x * size, centerY + direction.y * size);
    ctx.lineTo(
      centerX - direction.x * size * 0.7 + perpendicularX * size * 0.9,
      centerY - direction.y * size * 0.7 + perpendicularY * size * 0.9
    );
    ctx.lineTo(
      centerX - direction.x * size * 0.7 - perpendicularX * size * 0.9,
      centerY - direction.y * size * 0.7 - perpendicularY * size * 0.9
    );
    ctx.closePath();
    ctx.fillStyle = COLORS.arrow;
    ctx.fill();
  };

  SnakeGame.prototype.drawEyes = function (head) {
    var ctx = this.ctx;
    var cell = this.cell;
    var offset = cell * 0.2;
    var forward = cell * 0.18;
    var radius = Math.max(1.2, cell * 0.07);
    var perpendicularX = -this.direction.y;
    var perpendicularY = this.direction.x;
    var baseX = head.x * cell + cell / 2 + this.direction.x * forward;
    var baseY = head.y * cell + cell / 2 + this.direction.y * forward;
    var eyes = [
      { x: baseX + perpendicularX * offset, y: baseY + perpendicularY * offset },
      { x: baseX - perpendicularX * offset, y: baseY - perpendicularY * offset }

    for (var i = 0; i < eyes.length; i++) {
      ctx.beginPath();
      ctx.arc(eyes[i].x, eyes[i].y, radius, 0, Math.PI * 2);

    var dpad = document.getElementById('dpad');
    var dpadButtons = [];
    [['up', '▲'], ['left', '◀'], ['down', '▼'], ['right', '▶']].forEach(function (entry) {
      if (!dpad) return;

      var handled = false;
      button.type = 'button';
      button.className = input;
      button.textContent = entry[1];
      button.addEventListener('pointerdown', function (event) {
        handled = true;
        event.preventDefault();
        steer(input);
      });
      button.addEventListener('click', function (event) {
        event.preventDefault();

        steer(input);
      });

      var reasonKey = REASON_MESSAGES[snapshot.reason] || 'reasonOther';

        overlayHint.textContent = t('pausedHint');
        overlay.hidden = false;

      if (!wanted) return;
      event.preventDefault();
      steer(wanted);

    /* Touch: turn while the finger is still moving, so the snake reacts at once.
       A short movement counts as a tap: start, pause or resume. */
    var TURN_STEP = 22;   /* px of travel before another turn is queued */
    var TAP_SLOP = 12;    /* below this the gesture is a tap */
    var touchStart = null;
    var touchLast = null;

    function touchPoint(touch) {
      return { x: touch.clientX, y: touch.clientY };
    }

    function directionOf(deltaX, deltaY) {
      if (Math.abs(deltaX) > Math.abs(deltaY)) return deltaX > 0 ? 'right' : 'left';
      return deltaY > 0 ? 'down' : 'up';
    }

    canvas.addEventListener('touchstart', function (event) {
      var touch = event.changedTouches[0];
      if (!touch) return;
      touchStart = touchPoint(touch);
      touchLast = touchStart;
    }, { passive: true });

    canvas.addEventListener('touchmove', function (event) {
      if (!touchStart) return;
      var touch = event.changedTouches[0];
      if (!touch) return;
      var point = touchPoint(touch);
      var deltaX = point.x - touchLast.x;
      var deltaY = point.y - touchLast.y;
      if (Math.abs(deltaX) < TURN_STEP && Math.abs(deltaY) < TURN_STEP) return;
      event.preventDefault();
      steer(directionOf(deltaX, deltaY));
      touchLast = point;
    }, { passive: false });

    canvas.addEventListener('touchend', function (event) {
      if (!touchStart) return;
      var touch = event.changedTouches[0];
      var travelled = touch ? Math.max(
        Math.abs(touch.clientX - touchStart.x),
        Math.abs(touch.clientY - touchStart.y)
      ) : TAP_SLOP;
      touchStart = null;
      touchLast = null;
      if (travelled >= TAP_SLOP) return;   /* that was a swipe, not a tap */
      event.preventDefault();
      game.toggleStart();
    }, { passive: false });

    canvas.addEventListener('touchcancel', function () {
      touchStart = null;
      touchLast = null;
    });

    game.render();
  }

  window.SNAKE_DIFFICULTIES = DIFFICULTIES;
  window.SNAKE_LANGUAGES = LANGUAGES;
  window.SNAKE_MESSAGES = MESSAGES;

  } else {
    boot();
  }
